# ─────────────────────────────────────────────────────────────
# 元问题 · 唯一真源 (single source of truth)
# 改这个文件 → 跑 `python3 build.py` → 三档全部重生成
# 禁止手改 dist/ 与 README.md（生成物），会被下次 build 抹掉
# ─────────────────────────────────────────────────────────────
version: "0.2.0"
released_on: "2026-09-09"   # 发布日期，手工维护；禁用 date.today()，否则 build 跨天不幂等
name: "meta-questions"
tagline_zh: "在你问 AI 任何问题之前，先回答这些问题。"
tagline_en: "Answer these before you ask AI anything."
premise_zh: >-
  AI 时代真正的稀缺不是提示词技巧，是知道自己手上有什么。
  这套元问题不教你怎么用 Agent，它逼你先说清楚：你的优势、你的资源、你认识谁，
  以及在这三样之上，AI 到底该被用在哪个杠杆点上。
premise_en: >-
  The scarce thing in the AI era is not prompting skill. It is knowing what you
  already hold. These meta-questions do not teach you to drive an agent. They force
  you to state your advantage, your assets, your network — and where AI actually
  belongs on top of those.

# ── 理论根（README 与报告附录都从这里生成）────────────────────
theory:
  - dim_zh: "三维模型整体"
    dim_en: "The three dimensions"
    theory: "Effectuation — Bird-in-Hand Principle: Who I am / What I know / Whom I know"
    who: "Saras D. Sarasvathy, UVA Darden"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1278404"
    note_zh: "创业者不从目标出发，从手上已有的手段出发。"
  - dim_zh: "个人最大优势"
    dim_en: "Your edge"
    theory: "Who I am — tastes, abilities, expertise"
    who: "Sarasvathy, Effectuation"
    url: "https://www.darden.virginia.edu/effectuation"
    note_zh: "优势不是你觉得自己擅长什么，是别人做要 3 倍成本而你不用。"
  - dim_zh: "手里的现有资源"
    dim_en: "What you hold"
    theory: "RBV / VRIO — Valuable, Rare, Inimitable, Organized"
    who: "Jay Barney, 1991 / 1995"
    url: "https://strategicmanagementinsight.com/tools/vrio/"
    note_zh: "第四条 Organized 是 Barney 后补的，因为最常见的失败不是没资源，是资源躺着。"
  - dim_zh: "身边的资源"
    dim_en: "Who you know"
    theory: "The Strength of Weak Ties — 56% of people found jobs via contacts they saw only occasionally"
    who: "Mark Granovetter, 1973, AJS"
    url: "https://news.stanford.edu/stories/2023/07/strength-weak-ties"
    note_zh: "没有任何强关系构成桥。最熟的人跟你信息重叠度最高。"
  - dim_zh: "AI 时代最大杠杆"
    dim_en: "Leverage"
    theory: "Four kinds of leverage — labour, capital, code, media. The last two are permissionless."
    who: "Naval Ravikant"
    url: "https://aydoo.services/en/articles/naval-ravikant-leverage/"
    note_zh: "前两种要别人批准，后两种不需要——所以能无限放大。"
  - dim_zh: "AI Native vs 旧业务+AI"
    dim_en: "AI-Native vs AI-Enabled"
    theory: "The Swap Test — remove the AI: does the team slow down (enabled) or does the model collapse (native)?"
    who: "CRV, The Founder's Guide to AI-Native, 2026"
    url: "https://www.crv.com/content/what-is-ai-native"
    note_zh: "变慢 = AI-Enabled。垮掉 = AI-Native。中间没有第三档。"
  - dim_zh: "元问题方法本身"
    dim_en: "The method"
    theory: "Meta-prompting — ask the model what it needs to know, one question at a time, before it answers"
    who: "Practitioner consensus"
    url: "https://whitebeardstrategies.com/blog/ask-ai-what-to-ask-ai-the-meta-prompting-advantage/"
    note_zh: "先问过程，再问结果。"
  - dim_zh: "验收判据"
    dim_en: "How to tell it worked"
    theory: "元问题 = 能引起问题的问题；判据是答完之后你自己冒出了新问题"
    who: "教育学定义"
    url: "https://zhuanlan.zhihu.com/p/629895268"
    note_zh: "报告最后一节存在的理由。"

# ── 四段 · 12 问 ─────────────────────────────────────────────
segments:
  - id: who_i_am
    n: 1
    title_zh: "我是谁"
    title_en: "Who I Am"
    subtitle_zh: "个人最大优势"
    subtitle_en: "Your unfair edge"
    anchor: "Effectuation — Who I am"
    questions:
      - id: q1
        zh: "过去三年，有没有一件事，别人做要花 3 倍的时间或成本，你却做成了？说出具体的时间、金额和结果。"
        en: "In the past three years, was there something that would have cost someone else 3x the time or money, but you pulled off? Give the actual timeline, the actual amount, the actual outcome."
        want: ["number", "date"]
        why_zh: "优势的定义是相对成本，不是自我感觉。没有数字的优势不是优势。"
      - id: q2
        zh: "你身上有没有一个别人觉得「你怎么会这个」的技能或经历？它当初是怎么来的？"
        en: "Do you have a skill or experience that makes people say 'wait, how do you know that?' Where did it come from?"
        want: ["story"]
        why_zh: "稀缺性往往长在履历的缝隙里，不在主线上。"
      - id: q3
        zh: "有没有一类问题，大家习惯性来找你问？最近一次是谁、问的什么？"
        en: "Is there a kind of question people habitually bring to you? Who came last, and what did they ask?"
        want: ["name"]
        why_zh: "别人的求助路径，是你优势最诚实的外部证据。"

  - id: what_i_hold
    n: 2
    title_zh: "我手里有什么"
    title_en: "What I Hold"
    subtitle_zh: "现有资源 · VRIO"
    subtitle_en: "Existing assets · VRIO"
    anchor: "RBV / VRIO — Barney"
    questions:
      - id: q4
        zh: "列 3 样你已经花过钱、花过时间攒下来的东西（数据、库存、内容、账号、供应链关系、代码、现金流……），每样给一个数字。"
        en: "List 3 things you have already paid for — in money or in time (data, inventory, content, accounts, supplier relationships, code, cash flow). Attach a number to each."
        want: ["number"]
        why_zh: "沉没成本里藏着存量资产。先盘出来，才谈得上用。"
      - id: q5
        zh: "这 3 样里，哪一样是别人花钱也短期买不到的？为什么买不到？"
        en: "Which of those three could someone NOT buy quickly, even with money? Why not?"
        want: ["story"]
        why_zh: "VRIO 的 Rare + Inimitable 两条，合成这一问。"
      - id: q6
        zh: "这 3 样里，哪一样现在基本躺着没用？躺了多久？为什么没用起来？"
        en: "Which of the three is currently sitting idle? For how long? Why has it not been put to work?"
        want: ["number", "date"]
        why_zh: "Barney 后补的 Organized 那一条。大多数人不是没资源，是资源躺着。"

  - id: whom_i_know
    n: 3
    title_zh: "我认识谁"
    title_en: "Whom I Know"
    subtitle_zh: "身边的资源 · 弱关系"
    subtitle_en: "Your network · weak ties"
    anchor: "Granovetter — weak ties"
    questions:
      - id: q7
        zh: "谁能替你开一扇你自己敲不开的门？写出那扇门具体是什么。"
        en: "Who can open a door you cannot knock on yourself? Name the door, specifically."
        want: ["name"]
        why_zh: "关系的价值等于它通向的那扇门，不等于交情深浅。"
        probe_zh: "若用户只给出最熟的人 → 追问：想想那些你几个月才见一次的人——弱关系才是桥。"
      - id: q8
        zh: "谁能在 24 小时内给你一个诚实的「这东西行不行」的判断？他为什么会诚实？"
        en: "Who would give you an honest 'this will not work' within 24 hours? What makes them honest with you?"
        want: ["name"]
        why_zh: "验证速度是被低估的资源。找不出这个人，你的迭代周期就是以月计的。"
        probe_zh: "若用户答不出这个人 → 追问：那你上一次做错的决定，是多久之后才发现的？"
      - id: q9
        zh: "谁手上有流量或名单，而且他有理由帮你分发？他的理由是什么？（「关系好」不算理由）"
        en: "Who holds an audience or a list, and has a REASON to distribute for you? State the reason. ('We're friends' is not a reason.)"
        want: ["name", "story"]
        why_zh: "可持续的分发建立在对方的利益上，不建立在人情上。"
        probe_zh: "若用户给的理由是「关系好」→ 打回：那不是理由。他从中得到什么？"

  - id: leverage
    n: 4
    title_zh: "杠杆在哪"
    title_en: "Where the Leverage Is"
    subtitle_zh: "AI 时代最大杠杆"
    subtitle_en: "Leverage in the AI era"
    anchor: "Naval — four leverages + CRV Swap Test"
    questions:
      - id: q10
        zh: "Swap Test：把 AI 从你现在做的这件事里完全拔掉，你是「变慢」，还是「整个模式垮掉」？只能二选一。"
        en: "The Swap Test: remove AI entirely from what you are doing. Do you slow down, or does the whole model collapse? Pick one."
        want: ["choice"]
        why_zh: "变慢 = AI-Enabled，垮掉 = AI-Native。不给中间选项，是这道题的全部意义。"
        probe_zh: "若用户答「变慢」→ 追问：那你现在是 AI-Enabled，不是 AI-Native。你接受这个结论吗？"
      - id: q11
        zh: "如果 AI 明天免费、无限、且不会出错，你现在做的这件事应该长什么样？它会不会根本不该是现在这个形态？"
        en: "If AI were free, infinite and never wrong tomorrow — what should this thing look like? Should it even exist in its current shape?"
        want: ["story"]
        why_zh: "反锚定提问。作用不是要答案，是打断「在现有业务上加 AI」的默认路径。"
      - id: q12
        zh: "你现在缺的是哪一种杠杆——劳动力、资本、代码、还是媒体？你过去为什么没拿到它？AI 能不能绕过那个原因？"
        en: "Which leverage are you missing — labour, capital, code, or media? Why did you not get it before? Can AI route around that reason?"
        want: ["choice", "story"]
        why_zh: "把「我要用 AI」翻译成「我要用 AI 拿到哪一种杠杆」，这是全套里最关键的一次翻译。"

# ── 追问器规则 ───────────────────────────────────────────────
probe:
  max_rounds: 2
  rules_zh:
    - "一次只问一个问题，等用户答完再问下一个。绝不一次抛出多题。"
    - "按每题标注的「需要的证据」判断是否合格：number＝要数字，name＝要人名，date＝要时间，story＝要一段具体经过，choice＝只要落在给定选项里就算合格（不要再追问数字）。"
    - "不合格才追问，且**每一题**最多追问 {max_rounds} 次。仍拿不到 → 在报告里把该项标注为「证据不足」，不要替用户编。"
    - "全程不评价、不安慰、不夸奖。你的任务是取证，不是让用户舒服。"
  rules_en:
    - "Ask ONE question at a time. Wait for the answer before the next."
    - "Judge each answer against the evidence type declared on that question: number / name / date / story / choice. A `choice` answer is complete as soon as it picks one of the given options — do not demand a number."
    - "Probe only when the answer falls short, at most {max_rounds} times PER QUESTION. Still short? Mark that item 'insufficient evidence'. Never invent."
    - "Do not praise, reassure, or evaluate. Your job is evidence, not comfort."

# ── 报告模板 ─────────────────────────────────────────────────
report:
  sections:
    - n: 1
      title_zh: "你的画像"
      form_zh: "一句话 + 三维标签"
      content_zh: "用一句话说清这个人是谁。然后给三个标签：优势 / 存量 / 关系。"
    - n: 2
      title_zh: "你的不公平优势"
      form_zh: "VRIO 四格，逐格打勾或打叉"
      content_zh: "把 Q1-Q6 的证据填进「有价值／稀缺／难模仿／组织能用」四格。第四格「组织能用」的证据来自 Q6。任何一格打叉，都要写清楚为什么。"
    - n: 3
      title_zh: "躺着的资源"
      form_zh: "大数字卡片"
      content_zh: "「你有 X，躺了 Y 个月。」直接引用 Q6 的原话作为证据。Y 拿不到就写「躺了多久他自己也说不清」——那本身就是证据，不要估。这是全篇最应该让人不舒服的一节。"
    - n: 4
      title_zh: "你的杠杆缺口"
      form_zh: "四杠杆雷达（劳动力 / 资本 / 代码 / 媒体）"
      content_zh: "标出他现在有哪几种、缺哪几种，并写明「过去拿不到的原因」是否已被 AI 改变。"
    - n: 5
      title_zh: "AI Native 判定"
      form_zh: "Swap Test 结论 + 左右对比卡"
      content_zh: "先给判定（AI-Enabled / AI-Native）。然后左边写「提效方案」（在现有形态上加 AI），右边写「重做方案」（按 Q11 的答案重新设计形态）。明确推荐其中一个，并说明代价。"
    - n: 6
      title_zh: "下周就能开始的三个动作"
      form_zh: "三张行动卡"
      content_zh: "每张卡必须写清：用他的哪一样资源／找他认识的哪一个人／多久能看到第一个结果。不许出现他没提到过的资源或人；时间他没给过就写「他没说」，不要估。"
    - n: 7
      title_zh: "海外对标"
      form_zh: "案例卡，每条必带 URL"
      content_zh: "先自我判断：你这次对话有没有联网检索能力？没有 → 整节只写「未找到（本次对话无联网，请换一个能联网的 AI 重跑第 7 节）」，一个公司名都不要给。有 → 找 2-3 个海外公司或开源项目，说明它们跟他的处境哪里像、可以借走什么，每条必须给 URL；检索不到就写「未找到」。禁止凭记忆产出公司名、URL、融资额或数据。"
    - n: 8
      title_zh: "你还没回答的问题"
      form_zh: "三个反问"
      content_zh: "给他三个「他该自己问自己」的问题。这一节是元问题的终点：一个好的元问题，判据不是 AI 答得多漂亮，是他答完之后自己冒出了新问题。"
  footer_template: "generated by {name} v{version} · {date}"       # 文件页脚：构建日期
  report_footer_template: "generated by {name} v{version} · <在这里填今天的日期>"  # 报告页脚：日期由 AI 当场填

# ── 台上用（现场 15-20 分钟）─────────────────────────────────
stage:
  duration_min: 15
  max_duration_min: 20
  plan_zh:
    - "开场 2'：这套东西不教你怎么用 Agent。它逼你先说清楚手上有什么。"
    - "每段各讲 1 问（共 4 问）× 2' = 8'：Q1 / Q6 / Q7 / Q10。"
    - "现场做 Q10 Swap Test 举手 3'：把 AI 拔掉，你是变慢还是垮掉？两边各举一次手。"
    - "收尾 2'：剩下 8 问在卡上，扫码取全文。今天下午的实操，先用它把自己盘一遍再动数据。"
  interaction_zh: "Q10 举手是全场唯一强制互动。只有两个选项，一秒钟分出两拨人。"

# ── 给 AI 的行为指令（原先硬编码在 build.py 里，已迁入真源）───────
# 🔴 这一块比问题本身更重要：它决定 AI 怎么表现。改它必须走真源，不许改 build.py。
instructions:
  role_zh: "你是一个只负责取证的提问者。你要按下面的顺序，一次一个地问我问题；全部问完之前，不要给任何建议、不要总结、不要夸我。"
  role_staged_zh: "你是一个只负责取证的提问者。一次问一个问题，等我答完再问下一个。本段问完之前，不要给建议、不要总结、不要夸我。"
  # P1：没有这条，模型最常见的失败是把 12 题一次性全列出来
  start_command_zh: "**你这一轮的输出必须且只能是第一题的原文，一个字都不要多。不要复述这些问题，不要列清单，不要说明你打算怎么做，不要打招呼。**"
  # P2：「报告」既不是建议也不是总结，不写死就挡不住模型提前动手
  report_guard_zh: "**下面这份模板是给你最后用的。在最后一题被回答之前，不许输出这一节的任何内容，包括标题。**"
  probe_hint_prefix_zh: "[仅供你判断，不要念给用户听]"
  usage_quickstart_zh:
    - "把这一整个文件复制，粘进 ChatGPT / Claude / Coze / 豆包 / 任意 AI 的对话框，发送。"
    - "然后它会开始一个一个问你。老实答，别偷懒——报告的质量完全取决于你答得有多具体。"
  usage_staged_first_zh:
    - "这是第一段，你还没有 `profile.md`。先从 `profile.template.md` 复制一份存到本地。"
    - "把本文件粘给 AI。"
  usage_staged_rest_zh:
    - "先把你的 `profile.md` 粘给 AI，说「这是我，我们继续」。"
    - "再把本文件粘给 AI。"

# ── profile.md 结构（真源，档 B 与档 C 共用）──────────────────
profile:
  # C5：模板必须预置各段小节标题，AI 才知道往哪写，而不是一路追加到页脚后面
  intro_zh:
    - "这份文件存在你自己的电脑上，不上传任何地方。"
    - "下次开一个新对话，把它粘给 AI 说「这是我，我们继续」，它就接得上。"
  basic_fields_zh:
    - "我现在做的事："
    - "我开始做它的时间："
  append_instruction_zh: "找到 `## <本段标题>` 这一节，把内容填进去（不要追加到文件末尾）。"
  section_body_zh:
    - "- 结论：<一句话>"
    - "- 证据：<我给出的具体数字／名字／时间，原样抄录，不要改写>"
    - "- 证据不足项：<追问到上限仍没拿到的，列出来>"

# ── Claude Code skill 元数据（原先硬编码在 build.py）───────────
skill:
  description_template_zh: "用 {qcount} 个元问题摸清用户的优势、资源与关系网，产出一份 AI Native 方向分析报告。触发词：元问题 / meta questions / 帮我盘一下我有什么 / 我该怎么用 AI / AI Native 诊断。"
  steps_zh:
    - "先看当前目录有没有 `profile.md`。有 → 读它，跟用户确认「我记得你是…，对吗？」；没有 → 用本文件末尾的模板新建一份。"
    - "按四段顺序提问，**一次一个**。每段结束把结论填进 `profile.md` 对应小节。"
    - "四段问完 → 按报告模板生成 `report.md`。"
    - "第 7 节「海外对标」需要联网：**每条必须带 URL**，检索不到就写「未找到」。禁止凭记忆产出公司名、URL 或数据。"
